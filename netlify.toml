[build]
  base = "."
  command = "npm run db:generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_FLAGS = "--include=dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"
  # Bundle Prisma's generated client + schema so any standalone Netlify
  # Function (notably the LLM background function below) can talk to the
  # DB. Without this, a freshly-deployed function fails on first call
  # with `@prisma/client did not initialize yet`.
  included_files = [
    "node_modules/.prisma/client/**",
    "prisma/schema.prisma",
  ]

[functions."llm-audit-generate-background"]
  # Background Functions can run up to 15 minutes; we cap at 4 minutes
  # because the LLM call is 30-90s and a runaway call would otherwise
  # bill compute time we don't need.
  timeout = 240

